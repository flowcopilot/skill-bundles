name: Sync upstream skills

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

env:
  GIT_CONFIG_COUNT: 1
  GIT_CONFIG_KEY_0: init.defaultBranch
  GIT_CONFIG_VALUE_0: main

concurrency:
  group: sync-upstream-skills
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
      UPSTREAM_TOKEN: ${{ secrets.UPSTREAM_TOKEN }}
    steps:
      - name: Check out the repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          token: ${{ secrets.SYNC_TOKEN || github.token }}
      - name: Set up toolchains
        uses: jdx/mise-action@df8210ba1f29954aed392b1087dace56ca1d7854
      - name: Read the default branch
        id: settings
        run: |
          base=$(bun -p 'JSON.parse(await Bun.file("skill-bundles.json").text()).defaultBranch')
          git check-ref-format --branch "$base"
          echo "base=$base" >> "$GITHUB_OUTPUT"
      - name: Regenerate bundles at the latest refs
        run: bun run sync -- --update
      - name: Validate generated files
        run: |
          bun test
          bun run check
          bun run sync -- --check
          bun run validate
          lychee --offline --no-progress './**/*.md'
          actionlint .github/workflows/*.yml
          git diff --check
      - name: Detect changes
        id: changes
        run: |
          if [ -z "$(git status --porcelain --untracked-files=all)" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Prepare the review description
        if: steps.changes.outputs.changed == 'true'
        run: |
          mkdir -p .cache
          cat > .cache/sync-pr.md <<'BODY'
          ## Why

          Track the latest revisions of the configured upstream sources.

          ## What changes

          The sync regenerated the bundles, source pins, licenses, and attribution from bundle config.
          Each source is now at this revision:

          BODY
          bun -e 'const lock = await Bun.file("upstreams.lock.json").json(); for (const [bundle, sources] of Object.entries(lock.bundles)) for (const [id, pin] of Object.entries(sources)) console.log("- " + bundle + "/" + id + ": " + pin.revision)' >> .cache/sync-pr.md
          cat >> .cache/sync-pr.md <<'BODY'

          **Look at:** `upstreams.lock.json` and the imported references under `skills/`.

          ## Risk

          Installed copies of the bundles keep the old text until consumers update them.
          Review license changes before merge.
          BODY
      - name: Update the sync branch
        if: steps.changes.outputs.changed == 'true'
        env:
          SYNC_BRANCH: automation/sync-upstream-skills
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          remote_sha=$(git ls-remote --heads origin "$SYNC_BRANCH" | awk '{print $1}')
          git checkout -B "$SYNC_BRANCH"
          git add NOTICE.md upstreams.lock.json skills
          git commit -m "chore: sync upstream skills"
          if [ -n "$remote_sha" ]; then
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:${remote_sha}" origin "HEAD:${SYNC_BRANCH}"
          else
            git push --force-with-lease="refs/heads/${SYNC_BRANCH}:" origin "HEAD:${SYNC_BRANCH}"
          fi
      - name: Open or update the sync pull request
        if: steps.changes.outputs.changed == 'true' && env.SYNC_TOKEN != ''
        env:
          GH_TOKEN: ${{ env.SYNC_TOKEN }}
          BASE_BRANCH: ${{ steps.settings.outputs.base }}
          SYNC_BRANCH: automation/sync-upstream-skills
        run: |
          pull_request=$(gh pr list --head "$SYNC_BRANCH" --state open --json number --jq '.[0].number')
          if [ -z "$pull_request" ]; then
            gh pr create --base "$BASE_BRANCH" --head "$SYNC_BRANCH" --title "chore: sync upstream skills" --body-file .cache/sync-pr.md
          else
            gh pr edit "$pull_request" --body-file .cache/sync-pr.md
          fi
      - name: Report the compare link when no sync token is set
        if: steps.changes.outputs.changed == 'true' && env.SYNC_TOKEN == ''
        env:
          REPOSITORY_URL: ${{ github.server_url }}/${{ github.repository }}
          BASE_BRANCH: ${{ steps.settings.outputs.base }}
        run: |
          {
            echo "## Upstream changes are ready"
            echo
            echo "[Open a pull request](${REPOSITORY_URL}/compare/${BASE_BRANCH}...automation/sync-upstream-skills?expand=1)."
            echo "Set the SYNC_TOKEN secret to open future pull requests automatically and start their checks."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Report a failed sync
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          mkdir -p .cache
          echo "The upstream sync failed. [Read the run log](${RUN_URL}). Review the error before you update config, guards, patches, or license acceptance." > .cache/sync-failure.md
          issue=$(gh issue list --state open --search '"Upstream sync failed" in:title' --json number,title --jq '[.[] | select(.title == "Upstream sync failed")][0].number')
          if [ -z "$issue" ]; then
            gh issue create --title "Upstream sync failed" --body-file .cache/sync-failure.md
          else
            gh issue edit "$issue" --body-file .cache/sync-failure.md
          fi
